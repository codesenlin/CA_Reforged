name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  assemble:
    name: assembleDebug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ca/ 与 cadroid/ 是子模块，不拉就编译不了
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform & build-tools
        run: sdkmanager "platforms;android-33" "build-tools;34.0.0" > /dev/null

      - name: Build debug APK
        working-directory: cadroid
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --console=plain --stacktrace
